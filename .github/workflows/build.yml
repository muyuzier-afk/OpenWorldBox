name: Build APK

on:
  # 推送到 main 分支时构建
  push:
    branches: [ main ]
    # 关键路径变更才触发
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/build.yml'
  # PR 到 main 时构建
  pull_request:
    branches: [ main ]
  # 手动触发
  workflow_dispatch:
  # 发布 Release 时构建
  release:
    types: [ published ]

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取 submodule（ImGui）
          submodules: recursive

      - name: Patch Dobby for NDK 25+ clang
        run: |
          # === Patch 1: 文字池替代 ADRP ===
          # NDK 25+ 的 LLVM 对 ADRP 引用未定义外部符号报
          # "invalid symbol kind for ADRP relocation"。
          # 改用文字池（adr+ldr+.xword）绕过 ADRP 重定位。
          ASM_FILE="app/src/main/cpp/dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm"
          if ! grep -q ".Lccbh_pool" "$ASM_FILE" 2>/dev/null; then
            awk '
            /^adrp TMP_REG_0, cdecl\(common_closure_bridge_handler\)@PAGE$/ {
              print "adr TMP_REG_0, .Lccbh_pool"
              print "ldr TMP_REG_0, [TMP_REG_0]"
              print "blr TMP_REG_0"
              print "b .Lccbh_done"
              print ".align 3"
              print ".Lccbh_pool:"
              print ".xword cdecl(common_closure_bridge_handler)"
              print ".Lccbh_done:"
              getline; getline
              next
            }
            { print }
            ' "$ASM_FILE" > "$ASM_FILE.tmp" && mv "$ASM_FILE.tmp" "$ASM_FILE"
            echo "✓ Patched closure_bridge_arm64.asm (literal pool)"
          fi

          # === Patch 2: 移除 code-patch-tool-posix.cc ===
          # 该文件 include 了不存在的 core/arch/Cpu.h（Dobby 仓库从未有此文件）。
          DOBBY_CMAKE="app/src/main/cpp/dobby/CMakeLists.txt"
          if grep -q "code-patch-tool-posix" "$DOBBY_CMAKE"; then
            sed -i '/code-patch-tool-posix\.cc/d' "$DOBBY_CMAKE"
            echo "✓ Removed code-patch-tool-posix.cc from Dobby CMakeLists"
          fi

          # === Patch 3: 修复 os_arch_features.h 循环 include ===
          # platform.h 在定义 OSMemory 之前先 include dobby/common.h →
          # os_arch_features.h，导致此处 OSMemory 不可见（#pragma once 跳过 platform.h）。
          # 改用 POSIX sysconf/mprotect 替代 OSMemory 调用，打破循环依赖。
          OS_ARCH_FILE="app/src/main/cpp/dobby/common/os_arch_features.h"
          if grep -q "OSMemory::PageSize" "$OS_ARCH_FILE"; then
            sed -i \
              -e 's|#include "pac_kit.h"|#include <unistd.h>\n#include <sys/mman.h>\n#include "pac_kit.h"|' \
              -e 's|OSMemory::PageSize()|sysconf(_SC_PAGESIZE)|g' \
              -e 's|!OSMemory::SetPermission(page, sysconf(_SC_PAGESIZE), kReadExecute)|!(mprotect(page, sysconf(_SC_PAGESIZE), PROT_READ \| PROT_EXEC) == 0)|' \
              "$OS_ARCH_FILE"
            echo "✓ Patched os_arch_features.h (POSIX mprotect, break circular include)"
          fi

          # === Patch 4: 修复 ProcessRuntime.cc 字段名 ===
          # Dobby 重构后 MemRange.start 改为方法 start()，RuntimeModule 字段
          # load_address 改名为 base。Linux 版 .cc 未同步更新。
          PROCESS_RUNTIME_CC="app/src/main/cpp/dobby/source/Backend/UserMode/PlatformUtil/Linux/ProcessRuntime.cc"
          if grep -qE "module\.load_address|a\.start < b\.start" "$PROCESS_RUNTIME_CC"; then
            sed -i \
              -e 's|a\.start < b\.start|a.start() < b.start()|' \
              -e 's|module\.load_address|module.base|g' \
              "$PROCESS_RUNTIME_CC"
            echo "✓ Patched ProcessRuntime.cc (field names: start→start(), load_address→base)"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # packages 必须空格分隔。NDK 用 ubuntu-latest 预装的 27（不单独装，避免版本回退）
          packages: platforms;android-34 build-tools;34.0.0 cmake;3.22.1

      - name: Verify environment
        run: |
          echo "=== ImGui 源码检查 ==="
          ls -la app/src/main/cpp/imgui/imgui.h || { echo "ImGui submodule 未拉取"; exit 1; }
          echo "=== Dobby 源码检查 ==="
          ls -la app/src/main/cpp/dobby/CMakeLists.txt || { echo "Dobby submodule 未拉取"; exit 1; }
          echo "=== 预装 NDK 版本 ==="
          ls ${ANDROID_SDK_ROOT}/ndk/ || echo "无预装 NDK"
          echo "=== CMake 版本 ==="
          ls ${ANDROID_SDK_ROOT}/cmake/

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorldBox-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorldBox-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      # 如果是 release 发布，附加到 GitHub Release
      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
