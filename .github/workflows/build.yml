name: Build APK

on:
  # 推送到 main 分支时构建
  push:
    branches: [ main ]
    # 关键路径变更才触发
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/build.yml'
  # PR 到 main 时构建
  pull_request:
    branches: [ main ]
  # 手动触发
  workflow_dispatch:
  # 发布 Release 时构建
  release:
    types: [ published ]

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取 submodule（ImGui）
          submodules: recursive

      - name: Patch Dobby for NDK 25+ clang
        run: |
          # === Patch 1: ADRP 改用 GOT 间接（PIC 共享库兼容）===
          # NDK 25+ LLVM 对 adrp+@PAGE 引用外部函数符号报
          # "invalid symbol kind for ADRP relocation"。改用 GOT 间接加载，
          # 生成 R_AARCH64_ADR_GOT_PAGE / LD64_GOT_LO12_NC，PIC 合法。
          # 不能用文字池 .xword，否则链接报 R_AARCH64_ABS64（共享库禁止绝对重定位）。
          ASM_FILE="app/src/main/cpp/dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm"
          if grep -q "cdecl(common_closure_bridge_handler)@PAGE" "$ASM_FILE"; then
            sed -i \
              -e 's|adrp TMP_REG_0, cdecl(common_closure_bridge_handler)@PAGE|adrp TMP_REG_0, :got:cdecl(common_closure_bridge_handler)|' \
              -e 's|add TMP_REG_0, TMP_REG_0, cdecl(common_closure_bridge_handler)@PAGEOFF|ldr TMP_REG_0, [TMP_REG_0, :got_lo12:cdecl(common_closure_bridge_handler)]|' \
              "$ASM_FILE"
            echo "✓ Patched closure_bridge_arm64.asm (GOT indirect)"
          fi

          # === Patch 2: 修复 code-patch-tool-posix.cc（去掉不存在的 Cpu.h）===
          # 该文件 include 了不存在的 core/arch/Cpu.h。ClearCache 用 clang 内建
          # __builtin___clear_cache 替代。保留文件以提供 DobbyCodePatch 定义（链接需要）。
          CODE_PATCH_FILE="app/src/main/cpp/dobby/source/Backend/UserMode/ExecMemory/code-patch-tool-posix.cc"
          if grep -q 'core/arch/Cpu.h' "$CODE_PATCH_FILE"; then
            sed -i \
              -e '/#include "core\/arch\/Cpu.h"/d' \
              -e 's|ClearCache((void \*)clear_start_, (void \*)(clear_start_ + buffer_size))|__builtin___clear_cache((char *)clear_start_, (char *)(clear_start_ + buffer_size))|' \
              "$CODE_PATCH_FILE"
            echo "✓ Patched code-patch-tool-posix.cc (drop Cpu.h, use __builtin___clear_cache)"
          fi

          # === Patch 3: 修复 os_arch_features.h 循环 include ===
          # platform.h 在定义 OSMemory 之前先 include dobby/common.h →
          # os_arch_features.h，导致此处 OSMemory 不可见（#pragma once 跳过 platform.h）。
          # 改用 POSIX sysconf/mprotect 替代 OSMemory 调用，打破循环依赖。
          OS_ARCH_FILE="app/src/main/cpp/dobby/common/os_arch_features.h"
          if grep -q "OSMemory::PageSize" "$OS_ARCH_FILE"; then
            sed -i \
              -e 's|#include "pac_kit.h"|#include <unistd.h>\n#include <sys/mman.h>\n#include "pac_kit.h"|' \
              -e 's|OSMemory::PageSize()|sysconf(_SC_PAGESIZE)|g' \
              -e 's|!OSMemory::SetPermission(page, sysconf(_SC_PAGESIZE), kReadExecute)|!(mprotect(page, sysconf(_SC_PAGESIZE), PROT_READ \| PROT_EXEC) == 0)|' \
              "$OS_ARCH_FILE"
            echo "✓ Patched os_arch_features.h (POSIX mprotect, break circular include)"
          fi

          # === Patch 4: 修复 ProcessRuntime.cc 字段名 ===
          # Dobby 重构后 MemRange.start 改为方法 start()，RuntimeModule 字段
          # load_address 改名为 base。Linux 版 .cc 未同步更新。
          PROCESS_RUNTIME_CC="app/src/main/cpp/dobby/source/Backend/UserMode/PlatformUtil/Linux/ProcessRuntime.cc"
          if grep -qE "module\.load_address|a\.start < b\.start" "$PROCESS_RUNTIME_CC"; then
            sed -i \
              -e 's|a\.start < b\.start|a.start() < b.start()|' \
              -e 's|module\.load_address|module.base|g' \
              "$PROCESS_RUNTIME_CC"
            echo "✓ Patched ProcessRuntime.cc (field names: start→start(), load_address→base)"
          fi

          # === Patch 5: 全局修复 RuntimeModule.load_address 字段名 ===
          # Dobby 重构将 RuntimeModule.load_address 改名为 base，但多个 builtin-plugin
          # 与 PlatformUtil 的 .cc 未同步（dobby_symbol_resolver / import_replace 等）。
          # 所有 load_address 均为 RuntimeModule 字段，全局替换安全（ctx.load_bias 不受影响）。
          LOAD_ADDR_FILES=$(grep -rl 'load_address' app/src/main/cpp/dobby \
            --include='*.cc' --include='*.cpp' --include='*.h' --include='*.c' || true)
          if [ -n "$LOAD_ADDR_FILES" ]; then
            echo "$LOAD_ADDR_FILES" | xargs sed -i \
              -e 's/\.load_address/.base/g' \
              -e 's/->load_address/->base/g'
            echo "✓ Patched load_address → base in dobby sources (global)"
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # packages 必须空格分隔。NDK 用 ubuntu-latest 预装的 27（不单独装，避免版本回退）
          packages: platforms;android-34 build-tools;34.0.0 cmake;3.22.1

      - name: Verify environment
        run: |
          echo "=== ImGui 源码检查 ==="
          ls -la app/src/main/cpp/imgui/imgui.h || { echo "ImGui submodule 未拉取"; exit 1; }
          echo "=== Dobby 源码检查 ==="
          ls -la app/src/main/cpp/dobby/CMakeLists.txt || { echo "Dobby submodule 未拉取"; exit 1; }
          echo "=== 预装 NDK 版本 ==="
          ls ${ANDROID_SDK_ROOT}/ndk/ || echo "无预装 NDK"
          echo "=== CMake 版本 ==="
          ls ${ANDROID_SDK_ROOT}/cmake/

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorldBox-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorldBox-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      # 如果是 release 发布，附加到 GitHub Release
      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
